name: The Daily Insight Worker

on:
  push:
    paths-ignore:
      - 'posted_history.json'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install google-api-python-client google-auth google-auth-httplib2 requests feedparser beautifulsoup4

      - name: Run Ultimate 2-AI Master Newsroom
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python worker.py

      - name: Save Memory & Permanent Images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daily Insight Bot"
          mkdir -p images
          git add posted_history.json images/
          git diff --staged --quiet || git commit -m "Update memory and images [skip ci]"
          git push
          
