name: The Daily Insight Worker

on:
  push:
    paths-ignore:
      - 'posted_history.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install google-api-python-client google-auth google-auth-httplib2 requests feedparser

      - name: Run Master AI Newsroom
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py

      - name: Save Memory (posted_history.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daily Insight Bot"
          git add posted_history.json
          git diff --staged --quiet || git commit -m "Update posted history [skip ci]"
          git push
          
