name: The Daily Insight Worker

on:
  workflow_dispatch:
    inputs:
      custom_topic:
        description: "কাস্টম কোনো বিষয় লিখতে চাইলে এখানে দাও (না দিলে অটো নিউজ নেবে)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: |
          pip install requests feedparser beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client

      - name: Run Ultimate 2-AI Master Newsroom
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: python worker.py

      - name: Save Memory & Permanent Images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_history.json images/ || true
          if [ -f topic_queue.txt ]; then git add topic_queue.txt; fi
          git diff --staged --quiet || git commit -m "Auto-update history and images [skip ci]"
          git push
          
